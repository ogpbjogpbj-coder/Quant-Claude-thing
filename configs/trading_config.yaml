# Trading System Configuration
system:
  name: "QuantClaude AI Trading System"
  version: "2.0.0"
  mode: "live"  # live | paper | backtest

# Universe of tradeable symbols
universe:
  symbols:
    - SPY
    - QQQ
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
    - META
    - TSLA
    - AMD
    - JPM
    - V
    - MA
    - UNH
    - JNJ
    - PG
    - HD
    - BAC
    - XOM
    - CVX
    - AVGO
    - LLY
    - COST
    - ABBV
    - MRK
    - PEP
    - TMO
    - CRM
    - ADBE
    - NFLX

# Strategy weights (normalized internally)
strategies:
  momentum:
    enabled: true
    weight: 0.14
    lookback_periods: [5, 10, 21, 63]
  mean_reversion:
    enabled: true
    weight: 0.10
    z_score_entry: 2.0
    z_score_exit: 0.5
    lookback: 20
  ml_ensemble:
    enabled: true
    weight: 0.17
    retrain_interval_hours: 24
    features:
      - rsi_14
      - macd_signal
      - bb_position
      - volume_ratio
      - atr_pct
      - returns_5d
      - returns_21d
      - volatility_21d
      - price_vs_sma50
      - price_vs_sma200
  volatility_breakout:
    enabled: true
    weight: 0.08
    atr_multiplier: 1.5
    lookback: 20
  trend_following:
    enabled: true
    weight: 0.07
    fast_ma: 10
    slow_ma: 50
    signal_ma: 200
  pairs_trading:
    enabled: true
    weight: 0.08
    lookback: 60
    z_score_entry: 2.0
    z_score_exit: 0.5
    min_half_life: 5
    max_half_life: 60
    max_pairs: 10
  sentiment:
    enabled: true
    weight: 0.06
    min_articles: 3
    sentiment_threshold: 0.3
    cache_hours: 4
  adaptive:
    enabled: true
    weight: 0.10
    min_trades_to_learn: 20
    learning_lookback: 200
    min_rule_confidence: 0.55
    max_rules: 30
    evolution_interval_hours: 6
  catalyst:
    enabled: true
    weight: 0.12
    news_lookback_days: 7
    min_catalyst_score: 0.4
    cache_hours: 2
    wider_stop_multiplier: 4.0  # Wider stops for longer holding
    target_multiplier: 6.0      # Bigger targets for event-driven
    min_volume_surge: 1.5       # Require volume confirmation
    earnings_boost: 0.3         # Extra weight for earnings catalysts
    max_confidence: 0.80
    min_articles: 2
    max_holding_days: 21        # Auto-exit after 3 weeks
  sector_rotation:
    enabled: true
    weight: 0.08
    rotation_lookback: 21       # Days to measure sector momentum
    top_n_sectors: 3            # Overweight top N sectors
    bottom_n_sectors: 2         # Underweight/short bottom N
    min_sector_stocks: 2        # Need N stocks to represent sector

# Risk management
risk:
  max_portfolio_risk_pct: 2.0        # Max % of portfolio at risk
  max_position_size_pct: 5.0         # Max % per position
  max_single_trade_risk_pct: 1.0     # Max loss per trade as % of portfolio
  max_daily_loss_pct: 3.0            # Circuit breaker: halt if daily loss exceeds
  max_weekly_loss_pct: 5.0           # Circuit breaker: halt if weekly loss exceeds
  max_drawdown_pct: 10.0             # Circuit breaker: halt if drawdown exceeds
  max_open_positions: 20
  max_sector_exposure_pct: 25.0
  max_correlation_threshold: 0.85    # Skip if too correlated with existing
  stop_loss_atr_multiplier: 2.0      # Trailing stop as ATR multiple
  take_profit_atr_multiplier: 4.0
  max_holding_days: 30               # Default max hold for any position
  min_sharpe_ratio: 0.5              # Min signal quality to trade
  position_sizing: "kelly"           # kelly | equal | volatility_parity
  kelly_fraction: 0.25               # Use quarter-Kelly for safety
  # Drawdown recovery mode
  drawdown_recovery_enabled: true
  drawdown_caution_pct: 5.0          # Start scaling down positions at 5% drawdown
  drawdown_severe_pct: 10.0          # Heavy scaling at 10% drawdown
  recovery_min_scale: 0.2            # Minimum 20% of normal position size
  recovery_confidence_boost: 0.15    # Require 15% higher confidence during recovery

# Execution
execution:
  order_type: "limit"                # limit | market
  limit_offset_pct: 0.05            # % above/below for limit orders
  max_slippage_pct: 0.1
  retry_attempts: 3
  retry_delay_seconds: 5
  time_in_force: "day"
  enable_fractional: true
  enable_short_selling: true         # Allow opening short positions
  vwap_split_threshold: 5000.0      # Split orders above $5k into TWAP slices
  vwap_num_slices: 4                # Number of time slices
  vwap_slice_delay_seconds: 30      # Seconds between slices

# Scheduling
schedule:
  market_open_offset_minutes: 15     # Wait 15min after open
  market_close_offset_minutes: 15    # Stop 15min before close
  rebalance_interval_minutes: 30
  data_refresh_interval_minutes: 5

# Data
data:
  lookback_days: 120
  bar_timeframe: "1Day"
  intraday_timeframe: "15Min"
  cache_ttl_minutes: 5
